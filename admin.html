<!DOCTYPE html>
<html>
<head>
    <title>Snow Admin | Master Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background:#000; color:#fff; font-family:sans-serif; padding:20px; }
        .box { max-width:450px; margin:20px auto; background:#111; padding:25px; border-radius:15px; border:1px solid #333; }
        input, select { width:100%; padding:12px; margin:10px 0; background:#222; color:#fff; border:1px solid #444; border-radius:8px; }
        button { width:100%; padding:12px; margin:5px 0; border:none; font-weight:bold; cursor:pointer; border-radius:8px; }
        .user-card { border:1px solid #333; padding:20px; margin-bottom:20px; background:#111; border-radius:15px; }
    </style>
</head>
<body>

<div id="login-panel" class="box">
    <h2>Secure Login</h2>
    <input type="text" id="a-user" placeholder="Admin ID">
    <input type="password" id="a-pass" placeholder="Password">
    <button onclick="doLogin()" style="background:#00ff88;">ACCESS DASHBOARD</button>
</div>

<div id="admin-panel" style="display:none;">
    <h1 style="color:var(--gold)">User Management</h1>
    <div id="user-display"></div>
</div>

<script>
    const firebaseConfig = { /* USE SAME CONFIG AS INDEX.HTML */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function doLogin() {
        if(document.getElementById('a-user').value === "123456789" && document.getElementById('a-pass').value === "123") {
            document.getElementById('login-panel').style.display = "none";
            document.getElementById('admin-panel').style.display = "block";
            fetchUsers();
        } else { alert("Invalid Credentials!"); }
    }

    function fetchUsers() {
        db.ref('users').on('value', (snapshot) => {
            const users = snapshot.val();
            let html = "";
            for(let id in users) {
                let u = users[id];
                html += `<div class="user-card">
                    <h3>ID: ${id}</h3>
                    <p>Coins:</p><input type="number" id="c-${id}" value="${u.coins}">
                    <p>Ban Reason:</p><input type="text" id="r-${id}" value="${u.banReason || ''}" placeholder="Reason for ban/suspension">
                    <p>Suspend (Minutes):</p><input type="number" id="m-${id}" placeholder="Enter minutes">
                    
                    <button onclick="updateUser('${id}')" style="background:#fff;">Update Info</button>
                    <button onclick="tempBan('${id}')" style="background:orange;">Suspend User</button>
                    <button onclick="permaBan('${id}')" style="background:red; color:white;">Permanent Ban</button>
                    <button onclick="liftBan('${id}')" style="background:green; color:white;">Unban / Activate</button>
                </div>`;
            }
            document.getElementById('user-display').innerHTML = html;
        });
    }

    function updateUser(id) {
        db.ref('users/' + id).update({
            coins: parseFloat(document.getElementById('c-'+id).value),
            banReason: document.getElementById('r-'+id).value
        });
        alert("User data updated!");
    }

    function tempBan(id) {
        let mins = parseInt(document.getElementById('m-'+id).value);
        let reason = document.getElementById('r-'+id).value;
        if(!mins) return alert("Enter minutes!");
        let expiry = Date.now() + (mins * 60 * 1000);
        db.ref('users/' + id).update({ banUntil: expiry, banReason: reason, status: "active" });
        alert("Suspended for " + mins + " mins");
    }

    function permaBan(id) {
        let reason = document.getElementById('r-'+id).value;
        db.ref('users/' + id).update({ status: "banned", banReason: reason, banUntil: 0 });
        alert("Banned Permanently");
    }

    function liftBan(id) {
        db.ref('users/' + id).update({ status: "active", banUntil: 0, banReason: "" });
        alert("Account Activated");
    }
</script>
</body>
</html>
