<!DOCTYPE html>
<html>
<head>
    <title>Snow Admin | Secure</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background:#000; color:#fff; font-family:sans-serif; padding:20px; }
        .login-box { max-width:400px; margin:100px auto; background:#111; padding:30px; border-radius:15px; border:1px solid #333; text-align:center; }
        input { width:100%; padding:12px; margin:10px 0; background:#222; color:#fff; border:1px solid #444; border-radius:8px; }
        button { width:100%; padding:15px; background:#00ff88; border:none; font-weight:bold; border-radius:8px; cursor:pointer; }
        .user-card { border:1px solid #333; padding:15px; margin-bottom:10px; background:#111; border-radius:10px; }
    </style>
</head>
<body>

<div id="loginSection" class="login-box">
    <h2>Admin Login</h2>
    <input type="text" id="admID" placeholder="User ID">
    <input type="password" id="admPass" placeholder="Password">
    <button onclick="checkLogin()">LOGIN</button>
</div>

<div id="adminContent" style="display:none;">
    <h1>Admin Panel <button onclick="location.reload()" style="width:auto; padding:5px 15px;">Logout</button></h1>
    <div id="userList"></div>
</div>

<script>
    const firebaseConfig = {
  apiKey: "AIzaSyDCmRMyQVP-7WcYa6hdICTOX2c3SVR4oWQ",
  authDomain: "snow-tracker-4c87c.firebaseapp.com",
  databaseURL: "https://snow-tracker-4c87c-default-rtdb.firebaseio.com",
  projectId: "snow-tracker-4c87c",
  storageBucket: "snow-tracker-4c87c.appspot.com",
  messagingSenderId: "329295753653",
  appId: "1:329295753653:web:dd4dc2b82e96f3bd6269fc"
};
    const rdb = firebase.database();

    function checkLogin() {
        const id = document.getElementById('admID').value;
        const pass = document.getElementById('admPass').value;
        if(id === "123456789" && pass === "123") {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('adminContent').style.display = "block";
            loadUsers();
        } else { alert("Wrong ID or Password!"); }
    }

    function loadUsers() {
        rdb.ref('users').on('value', (s) => {
            const data = s.val();
            let html = "";
            for(let id in data) {
                let u = data[id];
                html += `<div class="user-card">
                    <h3>ID: ${id}</h3>
                    Coins: <input type="number" id="c-${id}" value="${u.coins}">
                    Diams: <input type="number" id="d-${id}" value="${u.diams}">
                    Notif: <input type="text" id="n-${id}" value="${u.notif || ''}">
                    Status: <input type="text" id="s-${id}" value="${u.status}">
                    <button onclick="save('${id}')">SAVE CHANGES</button>
                </div>`;
            }
            document.getElementById('userList').innerHTML = html;
        });
    }

    function save(id) {
        rdb.ref('users/' + id).update({
            coins: parseFloat(document.getElementById('c-'+id).value),
            diams: parseInt(document.getElementById('d-'+id).value),
            notif: document.getElementById('n-'+id).value,
            status: document.getElementById('s-'+id).value
        });
        alert("Updated Successfully!");
    }
</script>
</body>
</html>
