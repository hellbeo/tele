<!DOCTYPE html>
<html>
<head>
    <title>Snow Admin | Secure</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background:#000; color:#fff; font-family:sans-serif; padding:20px; }
        .box { max-width:400px; margin:50px auto; background:#111; padding:20px; border:1px solid #333; }
        input { width:100%; padding:10px; margin:10px 0; background:#222; color:#fff; border:1px solid #444; }
        button { width:100%; padding:10px; background:#00ff88; border:none; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>

<div id="loginSection">
    <div class="box">
        <h2>Admin Login</h2>
        <input type="text" id="admID" placeholder="User ID">
        <input type="password" id="admPass" placeholder="Password">
        <button onclick="checkLogin()">LOGIN</button>
    </div>
</div>

<div id="adminContent" style="display:none;">
    <h1>User Management</h1>
    <div id="userList"></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDCmRMyQVP-7WcYa6hdICTOX2c3SVR4oWQ",
      authDomain: "snow-tracker-4c87c.firebaseapp.com",
      projectId: "snow-tracker-4c87c",
      databaseURL: "https://snow-tracker-4c87c-default-rtdb.firebaseio.com/", 
      storageBucket: "snow-tracker-4c87c.firebasestorage.app",
      messagingSenderId: "329295753653",
      appId: "1:329295753653:web:dd4dc2b82e96f3bd6269fc"
    };
    firebase.initializeApp(firebaseConfig);
    const rdb = firebase.database();

    function checkLogin() {
        if(document.getElementById('admID').value === "123456789" && document.getElementById('admPass').value === "123") {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('adminContent').style.display = "block";
            loadUsers();
        } else { alert("Wrong!"); }
    }

    function loadUsers() {
        rdb.ref('users').on('value', (s) => {
            const data = s.val();
            let html = "";
            for(let id in data) {
                let u = data[id];
                html += `<div style="border:1px solid #333; padding:15px; margin-bottom:10px;">
                    <h3>ID: ${id}</h3>
                    Coins: <input type="number" id="c-${id}" value="${u.coins}">
                    Notif: <input type="text" id="n-${id}" value="${u.notif || ''}">
                    Status: <input type="text" id="s-${id}" value="${u.status}">
                    <button onclick="save('${id}')">SAVE</button>
                </div>`;
            }
            document.getElementById('userList').innerHTML = html;
        });
    }

    function save(id) {
        rdb.ref('users/' + id).update({
            coins: parseFloat(document.getElementById('c-'+id).value),
            notif: document.getElementById('n-'+id).value,
            status: document.getElementById('s-'+id).value
        });
        alert("Updated!");
    }
</script>
</body>
</html>
