<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snow Tracker | Game</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000; --card: #111; --gold: #ffcc00; --green: #00ff88; --silver: #b2bec3; --border: #333; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; font-family: sans-serif; padding-bottom: 90px; }

        .header { background: var(--card); padding: 15px; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .stat-box { background: #000; padding: 10px; border-radius: 12px; border: 1px solid var(--border); text-align: center; font-weight: bold; font-size: 13px; }

        .page { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .active-pg { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* TICKET BOX SYSTEM */
        .ticket-outer { width: 100%; max-width: 400px; margin: 20px auto; position: relative; }
        .ticket-fix-box { 
            width: 100%; aspect-ratio: 350 / 160; 
            background-size: 100% 100%; background-repeat: no-repeat; position: relative; border-radius: 10px; 
        }
        .digit-grid {
            position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%);
            width: 82%; display: grid; grid-template-columns: repeat(5, 1fr); text-align: center;
        }
        .digit { font-size: 6.5vw; font-weight: 900; color: #000; font-family: monospace; }
        @media(min-width: 450px) { .digit { font-size: 28px; } }

        .leopard-btn { width: 220px; height: 220px; border-radius: 50%; border: 6px solid var(--gold); background: url('leopard.png') center/cover; margin: 40px auto; cursor: pointer; }
        .nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: var(--card); display: flex; border-top: 1px solid var(--border); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; font-size: 11px; cursor: pointer; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

<header class="header">
    <div style="display:flex; justify-content:space-between; font-size:11px;">
        <span>UID: <b id="uID">--</b></span>
        <span>RANK: <b style="color:var(--gold)">LIVE</b></span>
    </div>
    <div class="stats-grid">
        <div class="stat-box">🪙 <span id="uCoins">0</span></div>
        <div class="stat-box">💎 <span id="uDiams">0</span></div>
        <div class="stat-box">LVL <span id="uLvl">1</span></div>
    </div>
</header>

<div id="mine-pg" class="page active-pg">
    <div id="uNotif" style="background:var(--gold); color:black; padding:10px; border-radius:10px; display:none; text-align:center; margin-bottom:10px; font-weight:bold;"></div>
    <div class="leopard-btn" onclick="mine()"></div>
</div>

<div id="store-pg" class="page">
    <button onclick="buyTik()" style="width:100%; padding:15px; background:var(--gold); border:none; font-weight:bold; border-radius:10px;">BUY TICKET (100k)</button>
    <div id="reveal" style="display:none; margin-top:20px;">
        <div class="ticket-outer"><div id="tikImg" class="ticket-fix-box"><div class="digit-grid" id="tikDigits"></div></div></div>
    </div>
</div>

<div id="rank-pg" class="page"><div id="leaderboard"><h3>Global Ranking</h3></div></div>
<div id="sell-pg" class="page"><div id="inv-list"></div></div>

<nav class="nav">
    <div class="nav-item active" onclick="go('mine',this)"><i class="fa fa-paw"></i>MINE</div>
    <div class="nav-item" onclick="go('store',this)"><i class="fa fa-ticket-alt"></i>STORE</div>
    <div class="nav-item" onclick="go('rank',this)"><i class="fa fa-trophy"></i>RANK</div>
    <div class="nav-item" onclick="go('sell',this)"><i class="fa fa-box"></i>SELL</div>
</nav>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDCmRMyQVP-7WcYa6hdICTOX2c3SVR4oWQ",
      authDomain: "snow-tracker-4c87c.firebaseapp.com",
      projectId: "snow-tracker-4c87c",
      databaseURL: "https://snow-tracker-4c87c-default-rtdb.firebaseio.com/", // Add your DB URL here
      storageBucket: "snow-tracker-4c87c.firebasestorage.app",
      messagingSenderId: "329295753653",
      appId: "1:329295753653:web:dd4dc2b82e96f3bd6269fc"
    };
    firebase.initializeApp(firebaseConfig);
    const rdb = firebase.database();

    let uid = localStorage.getItem('snow_uid') || "SNW-" + Math.floor(Math.random()*90000);
    localStorage.setItem('snow_uid', uid);

    let user = {};
    rdb.ref('users/' + uid).on('value', (s) => {
        user = s.val() || { id: uid, coins: 100000, diams: 0, lvl: 1, xp: 0, tickets: [], status: "active", notif: "" };
        if(user.status === 'banned') document.body.innerHTML = "<h1>BANNED</h1>";
        updateUI();
    });

    function updateUI() {
        document.getElementById('uID').innerText = user.id;
        document.getElementById('uCoins').innerText = Math.floor(user.coins).toLocaleString();
        document.getElementById('uDiams').innerText = user.diams;
        document.getElementById('uLvl').innerText = user.lvl;
        const n = document.getElementById('uNotif');
        if(user.notif) { n.innerText = user.notif; n.style.display='block'; } else { n.style.display='none'; }
    }

    function mine() { user.coins += 10; user.xp += 5; if(user.xp>=100){ user.lvl++; user.xp=0; confetti(); } sync(); }
    function sync() { rdb.ref('users/' + uid).set(user); }

    function buyTik() {
        if(user.coins < 100000) return alert("Low Coins!");
        user.coins -= 100000;
        let n = Array.from({length:5},()=>Math.floor(Math.random()*10)).join('');
        let counts = n.split('').reduce((a,b)=>{a[b]=(a[b]||0)+1; return a},{});
        let maxS = Math.max(...Object.values(counts));
        let type = maxS===5?"gold":(maxS>=3?"green":"silver");
        user.tickets = user.tickets || [];
        user.tickets.unshift({id:Date.now(), num:n, type:type});
        document.getElementById('reveal').style.display='block';
        document.getElementById('tikImg').style.backgroundImage = `url('${type}.png')`;
        document.getElementById('tikDigits').innerHTML = n.split('').map(d => `<div class="digit">${d}</div>`).join('');
        sync();
    }

    function go(p, el) {
        document.querySelectorAll('.page').forEach(x=>x.classList.remove('active-pg'));
        document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
        document.getElementById(p+'-pg').classList.add('active-pg');
        el.classList.add('active');
        if(p==='sell') renderInv();
        if(p==='rank') renderRank();
    }

    function renderInv() {
        const list = document.getElementById('inv-list');
        list.innerHTML = (user.tickets || []).map(t => `<div style="background:#111; padding:15px; margin:10px; border-radius:10px; display:flex; justify-content:space-between; border-left:4px solid var(--${t.type})">
            <b>${t.num}</b> <button onclick="sell(${t.id})" style="background:#fff; border:none; padding:5px 10px; border-radius:5px;">SELL</button>
        </div>`).join('');
    }

    function sell(id) {
        let i = user.tickets.findIndex(x=>x.id===id);
        let t = user.tickets[i];
        if(t.type==='gold') user.diams+=100; else if(t.type==='green') user.diams+=20; else user.coins+=10000;
        user.tickets.splice(i,1); sync(); renderInv();
    }

    function renderRank() {
        rdb.ref('users').orderByChild('coins').limitToLast(10).once('value', (s) => {
            let html = "<h3>Global Top 10</h3>";
            s.forEach(child => {
                let u = child.val();
                html += `<div style="padding:10px; background:#111; margin-bottom:5px; border-radius:10px; display:flex; justify-content:space-between;"><span>${u.id}</span> <b>${Math.floor(u.coins).toLocaleString()}</b></div>`;
            });
            document.getElementById('leaderboard').innerHTML = html;
        });
    }
</script>
</body>
</html>
