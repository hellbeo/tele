<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snow Tracker | Professional Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000; --card: #111; --gold: #ffcc00; --red: #ff4757; --border: #333; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; padding-bottom: 90px; }

        /* OVERLAYS */
        #ban-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 25px; }
        #notif-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; width: 85%; padding: 25px; border-radius: 20px; border: 1px solid var(--gold); z-index: 1001; text-align: center; }
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; }

        /* HEADER & STATS */
        .header { background: var(--card); padding: 15px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
        .stat-box { background: #111; padding: 10px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 13px; border: 1px solid #222; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .stat-box img { width: 18px; height: 18px; }

        .page { display: none; padding: 20px; }
        .active-pg { display: block; }

        /* MINE BUTTON */
        .leopard-btn { width: 220px; height: 220px; border-radius: 50%; border: 6px solid var(--gold); background: url('coin.png') center/cover; margin: 40px auto; cursor: pointer; }
        .leopard-btn:active { transform: scale(0.95); }

        /* FIXED TICKET BOX SYSTEM */
        .lucky-box-container {
            width: 100%;
            max-width: 360px;
            margin: 20px auto;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .ticket-visual {
            position: relative;
            width: 100%;
            aspect-ratio: 1264 / 574; /* Matching your golden ticket size */
            background-size: cover;
            background-position: center;
            border-radius: 8px;
        }
        .digit-grid {
            position: absolute;
            top: 52%; /* Centered in the white boxes */
            left: 50.5%;
            transform: translate(-50%, -50%);
            width: 82%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
        }
        .digit { 
            font-size: 7.5vw; 
            font-weight: 900; 
            color: #000; 
            font-family: 'Courier New', monospace; 
            text-align: center;
        }

        /* RANKING TABLE */
        .rank-row { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #222; }
        .rank-my-pos { background: var(--gold); color: #000; font-weight: bold; border-radius: 10px; margin-top: 15px; }

        /* NAV */
        .nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #111; display: flex; border-top: 1px solid #222; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; font-size: 11px; }
        .nav-item.active { color: var(--gold); }
        .tg-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #0088cc; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ban-overlay">
    <div id="perma-ui" style="display:none;">
        <h1 style="color:var(--red)">ACCOUNT BANNED</h1>
        <p style="margin:20px 0; color:#ccc;">Permanent ban for rules violation.</p>
        <a href="https://t.me/Gaurav_069" class="tg-btn">Contact Admin</a>
    </div>
    <div id="suspend-ui" style="display:none;">
        <h1 style="color:orange">SUSPENDED</h1>
        <h2 id="ban-timer" style="color:var(--gold); margin:20px 0;">00:00:00</h2>
        <a href="https://t.me/Gaurav_069" class="tg-btn">Support</a>
    </div>
</div>

<div class="modal-bg" onclick="closeNotif()"></div>
<div id="notif-modal">
    <p id="notif-text"></p>
    <button onclick="closeNotif()" style="width:100%; padding:10px; background:var(--gold); border:none; border-radius:10px; margin-top:15px;">Close</button>
</div>

<header class="header">
    <div>ID: <b id="uID">--</b></div>
    <div onclick="openNotif()" style="position:relative;"><i class="fa fa-bell" style="color:var(--gold)"></i><span id="notif-dot" style="display:none; position:absolute; top:-5px; right:-5px; width:10px; height:10px; background:red; border-radius:50%;"></span></div>
</header>

<div class="stats-grid">
    <div class="stat-box"><img src="coin.png"> <span id="uCoins">0</span></div>
    <div class="stat-box">💎 <span id="uDiams">0</span></div>
    <div class="stat-box">LVL <span id="uLvl">1</span></div>
</div>

<div id="mine-pg" class="page active-pg">
    <div class="leopard-btn" onclick="mine()"></div>
</div>

<div id="store-pg" class="page">
    <button onclick="buyTik()" style="width:100%; padding:15px; background:var(--gold); border:none; font-weight:bold; border-radius:10px;">PURCHASE LUCKY BOX (100k)</button>
    <div id="reveal" style="display:none; margin-top:20px;">
        <div class="lucky-box-container">
            <div id="tikImg" class="ticket-visual">
                <div class="digit-grid" id="tikDigits"></div>
            </div>
        </div>
    </div>
</div>

<div id="inv-pg" class="page">
    <h3>Inventory</h3>
    <div id="inv-list"></div>
</div>

<div id="rank-pg" class="page">
    <h3>Top 49 Rankings</h3>
    <div id="leaderboard" style="background:#111; border-radius:15px; margin-top:10px; overflow:hidden;"></div>
    <div id="my-special-rank"></div>
</div>

<nav class="nav">
    <div class="nav-item active" onclick="go('mine',this)"><i class="fa fa-hand-pointer"></i>MINE</div>
    <div class="nav-item" onclick="go('store',this)"><i class="fa fa-shopping-basket"></i>STORE</div>
    <div class="nav-item" onclick="go('inv',this)"><i class="fa fa-wallet"></i>SELL</div>
    <div class="nav-item" onclick="go('rank',this)"><i class="fa fa-medal"></i>RANK</div>
</nav>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDCmRMyQVP-7WcYa6hdICTOX2c3SVR4oWQ",
      authDomain: "snow-tracker-4c87c.firebaseapp.com",
      projectId: "snow-tracker-4c87c",
      databaseURL: "https://snow-tracker-4c87c-default-rtdb.firebaseio.com/",
      storageBucket: "snow-tracker-4c87c.firebasestorage.app",
      messagingSenderId: "329295753653",
      appId: "1:329295753653:web:dd4dc2b82e96f3bd6269fc"
    };
    firebase.initializeApp(firebaseConfig);
    const rdb = firebase.database();

    let uid = localStorage.getItem('snow_uid') || "SNW-" + Math.floor(100000 + Math.random()*899999);
    localStorage.setItem('snow_uid', uid);

    let user = {};

    rdb.ref('users/' + uid).on('value', (s) => {
        if(!s.exists()) {
            user = { id: uid, coins: 0, diams: 0, lvl: 1, tickets: [], status: "active", banUntil: 0, notif: "Welcome!" };
            sync();
        } else {
            user = s.val();
        }
        checkBanState();
        updateUI();
    });

    function updateUI() {
        document.getElementById('uID').innerText = user.id;
        document.getElementById('uCoins').innerText = Math.floor(user.coins).toLocaleString();
        document.getElementById('uDiams').innerText = user.diams;
        document.getElementById('uLvl').innerText = user.lvl;
        document.getElementById('notif-dot').style.display = (user.notif && user.notif !== "") ? "block" : "none";
    }

    function sync() { rdb.ref('users/' + uid).set(user); }
    function mine() { user.coins += 1; sync(); }

    function buyTik() {
        if(user.coins < 100000) return alert("Not enough coins!");
        user.coins -= 100000;
        let n = Array.from({length:5},()=>Math.floor(Math.random()*10)).join('');
        let counts = n.split('').reduce((a,b)=>{a[b]=(a[b]||0)+1; return a},{});
        let maxS = Math.max(...Object.values(counts));
        let type = maxS===5?"gold":(maxS>=3?"green":"silver");
        
        user.tickets = user.tickets || [];
        user.tickets.unshift({id:Date.now(), num:n, type:type});
        
        document.getElementById('reveal').style.display='block';
        document.getElementById('tikImg').style.backgroundImage = `url('${type}.png')`;
        document.getElementById('tikDigits').innerHTML = n.split('').map(d => `<div class="digit">${d}</div>`).join('');
        if(type==='gold') confetti();
        sync();
    }

    function renderInv() {
        const list = document.getElementById('inv-list');
        list.innerHTML = (user.tickets || []).map(t => `
            <div style="background:#111; padding:15px; margin-bottom:10px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; border-left:4px solid var(--${t.type})">
                <span><b>${t.num}</b> (${t.type.toUpperCase()})</span>
                <button onclick="sellItem(${t.id})" style="background:#fff; border:none; padding:8px 15px; border-radius:8px; font-weight:bold;">SELL</button>
            </div>`).join('');
    }

    function sellItem(id) {
        let i = user.tickets.findIndex(x=>x.id===id);
        let t = user.tickets[i];
        if(t.type==='gold') user.diams+=100; else if(t.type==='green') user.diams+=20; else user.coins+=15000;
        user.tickets.splice(i,1); sync(); renderInv();
    }

    function loadRanks() {
        rdb.ref('users').orderByChild('coins').on('value', snap => {
            let arr = [];
            snap.forEach(c => { arr.push(c.val()); });
            arr.reverse(); // Highest first
            
            let top49 = arr.slice(0, 49);
            let html = "";
            top49.forEach((u, i) => {
                html += `<div class="rank-row" style="${u.id===uid?'background:#222':''}">
                    <span>${i+1}. ${u.id}</span>
                    <b style="color:var(--gold)">${Math.floor(u.coins).toLocaleString()}</b>
                </div>`;
            });
            document.getElementById('leaderboard').innerHTML = html;

            // Find current user rank
            let myIndex = arr.findIndex(x => x.id === uid);
            if (myIndex >= 49) {
                document.getElementById('my-special-rank').innerHTML = `
                <div class="rank-row rank-my-pos">
                    <span>${myIndex+1}. ${user.id} (YOU)</span>
                    <span>${Math.floor(user.coins).toLocaleString()}</span>
                </div>`;
            } else {
                document.getElementById('my-special-rank').innerHTML = "";
            }
        });
    }

    function checkBanState() {
        const now = Date.now();
        if(user.status === 'banned') {
            document.getElementById('ban-overlay').style.display = 'flex';
            document.getElementById('perma-ui').style.display = 'block';
        } else if(user.banUntil && now < user.banUntil) {
            document.getElementById('ban-overlay').style.display = 'flex';
            document.getElementById('suspend-ui').style.display = 'block';
            let itv = setInterval(() => {
                let d = user.banUntil - Date.now();
                if(d <= 0) { clearInterval(itv); location.reload(); }
                let m = Math.floor(d/60000); let s = Math.floor((d%60000)/1000);
                document.getElementById('ban-timer').innerText = `${m}:${s}`;
            }, 1000);
        } else {
            document.getElementById('ban-overlay').style.display = 'none';
        }
    }

    function openNotif() { document.querySelector('.modal-bg').style.display='block'; document.getElementById('notif-modal').style.display='block'; document.getElementById('notif-text').innerText = user.notif; }
    function closeNotif() { document.querySelector('.modal-bg').style.display='none'; document.getElementById('notif-modal').style.display='none'; }

    function go(p, el) {
        document.querySelectorAll('.page').forEach(x=>x.classList.remove('active-pg'));
        document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
        document.getElementById(p+'-pg').classList.add('active-pg');
        el.classList.add('active');
        if(p==='inv') renderInv();
        if(p==='rank') loadRanks();
    }
</script>
</body>
</html>
